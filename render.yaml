# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: fake-news-detector
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/download_nltk.py
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
